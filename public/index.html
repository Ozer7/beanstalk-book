<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storybook: a picture book with you in it</title>
<meta name="description" content="Upload a photo and get a 20-page picture book starring you, in under a minute.">
<link rel="preload" href="/fonts/andika/andika-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces/fraunces-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Andika;src:url(/fonts/andika/andika-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Andika;src:url(/fonts/andika/andika-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Fraunces;src:url(/fonts/fraunces/fraunces-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--dusk:#171f3f;--dusk2:#2b3468;--mist:#c6d0ea;--ink:#1b2a41;--soft:#56627a;--paper:#fffbf1;--edge:#e7dcc3;--gold:#e8b23a;--jack:#2f8a57;--red:#d0303b;--story:var(--gold)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--paper);font:400 17px/1.55 Andika,system-ui,sans-serif;background:radial-gradient(90vw 70vh at 50% 108%,#59507f 0,transparent 70%),linear-gradient(#141b38,var(--dusk) 45%,var(--dusk2));background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.08;margin:0}
h1{font-size:clamp(38px,6.2vw,70px);letter-spacing:-.015em;max-width:14ch}
h2{font-size:clamp(25px,3.2vw,34px)}
h3{font-size:20px}
p{margin:0}a{color:inherit}img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:16px;padding:18px 0}
.logo{font:700 24px Fraunces,Georgia,serif;text-decoration:none;margin-right:auto}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.linkish{background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.purse{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 14px 4px 8px;white-space:nowrap;position:relative}
.purse svg{width:24px;height:24px}
.coin{position:absolute;left:14px;top:-70px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b98718;animation:coin .75s cubic-bezier(.5,0,.9,.6) both}
@keyframes coin{to{transform:translateY(74px)}}
.btn{display:inline-block;background:var(--gold);color:#241a02;border:0;border-radius:10px;padding:13px 24px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:#f3c452}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost:hover{background:rgba(127,127,127,.15)}
.btn.small{padding:7px 14px;font-size:15px}
.btn.big{font-size:19px;padding:15px 30px}
.note{color:var(--mist);font-size:15px}
.onpaper .note,.paper .note,.open .note{color:var(--soft)}
.err{background:#fbe6e6;color:#7c1a21;border-radius:8px;padding:10px 14px;margin:12px 0}
.ok{background:#e4f2e8;color:#1b5234;border-radius:8px;padding:10px 14px;margin:12px 0}
footer{padding:40px 0 44px;color:var(--mist);font-size:15px}
.hero{padding:16px 0 4px;display:grid;gap:14px}
.hero p{max-width:48ch;font-size:19px;color:var(--mist)}

/* The books on the shelf */
.shelf-row{display:flex;justify-content:center;gap:clamp(22px,7vw,90px);margin:34px 0 0;perspective:1500px;padding:0 6px 26px;border-bottom:10px solid #4a342b}
.book3d{--w:clamp(138px,27vw,290px);width:var(--w);aspect-ratio:2/3;position:relative;transform-style:preserve-3d;transform:rotateY(-24deg);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:block;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:var(--paper)}
.book3d:hover,.book3d:focus-visible{transform:rotateY(-6deg) translateY(-12px) scale(1.04)}
.book3d .front{position:absolute;inset:0;border-radius:3px 8px 8px 3px;overflow:hidden;background:var(--dusk2);box-shadow:inset 8px 0 9px -5px rgba(0,0,0,.55),10px 14px 26px rgba(0,0,0,.45);transform:translateZ(14px)}
.book3d .front img{width:100%;height:100%;object-fit:cover}
.book3d .pages{position:absolute;top:1.5%;bottom:1.5%;right:0;width:28px;background:repeating-linear-gradient(90deg,#fff8e6 0 2px,#d9cdb2 2px 3px);transform:rotateY(90deg) translateZ(-14px);transform-origin:right}
.book3d .spine{position:absolute;top:0;bottom:0;left:0;width:28px;background:var(--bk,#333);transform:rotateY(-90deg);transform-origin:left;border-radius:3px 0 0 3px}
.book3d .title{position:absolute;left:7%;right:7%;top:5%;font:700 clamp(17px,3.1vw,31px)/1.06 Fraunces,Georgia,serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 18px rgba(0,0,0,.45)}
.book3d .painting{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--mist);font-size:15px}
.tiny{--w:clamp(104px,20vw,150px)}
.tiny .title{font-size:clamp(12px,1.5vw,15px)}
.shelf{display:flex;flex-wrap:wrap;gap:26px 22px;margin-top:20px;perspective:1100px}
.shelf .item{width:clamp(104px,20vw,150px)}
.shelf small{display:block;margin-top:10px;color:var(--mist);font-size:14px;line-height:1.3}
section{padding:30px 0}

/* An open book */
.open{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.5);position:relative;perspective:1600px;margin-top:6px}
.open:after{content:"";position:absolute;top:0;bottom:0;left:calc(5/11*100%);width:44px;margin-left:-22px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(60,40,10,.2) 49%,rgba(60,40,10,.26) 50%,transparent)}
.leftp{padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.rightp{padding:clamp(20px,4vw,44px)}
.titleline{font:700 clamp(25px,3.5vw,38px)/1.1 Fraunces,Georgia,serif}
.titleline em{font-style:normal;color:var(--story)}
.oval{width:clamp(150px,20vw,220px);aspect-ratio:4/5;border-radius:50%;display:grid;place-items:center;text-align:center;cursor:pointer;background:#f3ebd8;box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--story),0 0 0 14px var(--paper),0 0 0 15px var(--edge);overflow:hidden;position:relative;margin:14px;padding:18px;font-weight:700;font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.15;transition:transform .15s}
.oval:hover,.oval.over{transform:scale(1.03)}
.oval img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oval input{position:absolute;opacity:0;width:1px;height:1px}
.oval:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:18px}
label{display:block;font-weight:700;margin:16px 0 5px}
label small{font-weight:400;color:var(--soft)}
input[type=text],input[type=number],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--edge);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--ink);outline:0}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg label{margin:0;font-weight:400;padding:6px 16px;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--ink);color:var(--paper)}
.seg label:has(input:focus-visible){outline:3px solid var(--story);outline-offset:-5px}
details{margin-top:16px}summary{cursor:pointer;font-weight:700}
.go{margin-top:20px;padding-top:16px;border-top:1.5px solid var(--edge)}
.swing{position:absolute;top:0;bottom:0;right:0;width:calc(6/11*100%);transform-origin:left center;transform-style:preserve-3d;animation:swing 1s cubic-bezier(.45,.05,.3,1) .1s both;pointer-events:none;z-index:4}
.swing img,.swing div{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;backface-visibility:hidden;border-radius:0 6px 6px 0}
.swing div{transform:rotateY(180deg);background:var(--story)}
@keyframes swing{to{transform:rotateY(-178deg);visibility:hidden}}

/* Being painted */
.making{display:grid;grid-template-columns:clamp(70px,10vw,120px) minmax(0,1fr);gap:clamp(14px,3vw,34px);align-items:stretch;margin-top:6px}
.vine{width:100%;height:100%;min-height:380px;overflow:visible}
.status h2{min-height:2.2em}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s ease-out}
.easel{display:grid;grid-template-columns:minmax(150px,270px) minmax(0,1fr);gap:clamp(14px,3vw,30px);margin-top:18px;align-items:start;perspective:1200px}
.fresh{aspect-ratio:2/3;background:var(--paper);border-radius:3px;box-shadow:0 16px 30px rgba(0,0,0,.45);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--soft);text-align:center;padding:12px;transform-style:preserve-3d}
.fresh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:wet 1s ease-out both}
@keyframes wet{from{opacity:0;filter:blur(9px) saturate(.2) brightness(1.3)}to{opacity:1;filter:none}}
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:2/3;border-radius:2px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--mist);font-size:13px;overflow:hidden;position:relative}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:land .45s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes land{from{transform:translateX(-46px) rotateY(50deg);opacity:0}to{transform:none;opacity:1}}

/* Reading */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:clamp(20px,4vw,44px);align-items:start;margin-top:14px}
.stack{position:relative;aspect-ratio:2/3;width:100%;max-width:min(560px,calc((100vh - 120px)*2/3));margin:0 auto;perspective:1900px;touch-action:pan-y;cursor:grab;user-select:none}
.leaf{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden;border-radius:2px 5px 5px 2px;box-shadow:0 18px 34px rgba(0,0,0,.5),inset 10px 0 14px -10px rgba(60,40,10,.5);transform-origin:left center;backface-visibility:hidden;container-type:inline-size}
.leaf.top{z-index:2}
.leaf.anim{transition:transform .62s cubic-bezier(.4,.05,.35,1)}
.leaf>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.words{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(255,251,241,.93);border-radius:2.8cqw;color:var(--ink);white-space:nowrap}
.words.title{font-family:Fraunces,Georgia,serif;font-weight:700}
.words small{font-family:Andika,sans-serif;font-weight:400;color:var(--soft)}
.about{position:absolute;inset:0;padding:6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.5cqw;font-size:3.4cqw}
.about h3{font-size:8cqw;color:var(--story)}
.about img{width:50cqw;aspect-ratio:1;object-fit:cover;margin:2cqw 0}
.about b{font:700 6cqw Fraunces,Georgia,serif}
.about dl{margin:2cqw 0 0}.about dt{font-weight:700;color:var(--story);font-size:2.7cqw;margin-top:1.6cqw}.about dd{margin:0}
.back{position:absolute;inset:0;background:var(--story);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;text-align:center;padding:8cqw}
.back h3{font-size:11cqw}
.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px auto 0}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:16px}
.strip button{padding:0;border:0;background:none;cursor:pointer;border-radius:2px;overflow:hidden;aspect-ratio:2/3;opacity:.7;color:var(--mist)}
.strip button[aria-current=true],.strip button:hover{opacity:1;outline:2px solid var(--gold)}
.strip img{width:100%;height:100%;object-fit:cover}
.scores{font-size:14.5px;margin-top:6px;color:var(--mist)}

/* Money */
.bignum{font:700 clamp(46px,8vw,76px)/1 Fraunces,Georgia,serif}
.money{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:start;margin-top:14px}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(18px,3vw,28px);box-shadow:0 16px 30px rgba(0,0,0,.35)}
.table{width:100%;border-collapse:collapse;font-size:16px;margin-top:10px}
.table th{text-align:left;font-weight:700;padding:6px 10px 6px 0;border-bottom:1.5px solid var(--ink)}
.table td{padding:9px 10px 9px 0;border-bottom:1px solid var(--edge);vertical-align:top}
.num{text-align:right!important;white-space:nowrap;font-variant-numeric:tabular-nums}
.plus{color:#1f7a46;font-weight:700}
.refund{display:grid;gap:8px;margin-top:8px;padding:10px;background:#fff;border-radius:8px}
.refund[hidden]{display:none}
@media (max-width:760px){
 .open{grid-template-columns:minmax(0,1fr)}
 .open:after,.swing{display:none}
 .leftp{padding-bottom:0}
 .reader,.money{grid-template-columns:minmax(0,1fr)}
 .easel{grid-template-columns:minmax(0,1fr)}
 .fresh{max-width:220px;margin:0 auto;width:100%}
 .slots{gap:4px}
 .slot{font-size:10px}
 .vine{min-height:300px}
 .table{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.swing{display:none}.coin{display:none}.book3d{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="top"><a class="logo" href="#/">Storybook</a><span id="who"></span></header>
  <main id="app"></main>
  <footer><a href="/bible">Meet the characters and see every painted page</a> &nbsp; <a href="/privacy">Privacy</a></footer>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (c) => `$${(Math.abs(c) / 100).toFixed(2)}`;
const when = (d) => new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const app = $("#app");
const COLORS = { jack: "var(--jack)", red: "var(--red)" };
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let catalog = null, me = undefined, stream = null;
const PURSE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e8b23a" d="M4 10c0-2 2-3 8-3s8 1 8 3v8c0 2-3 3-8 3s-8-1-8-3z"/><path fill="none" stroke="#a97b12" stroke-width="1.6" d="M7 7c1-3 3-4 5-4s4 1 5 4"/><circle cx="12" cy="12" r="1.7" fill="#a97b12"/></svg>`;

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", ...opts, headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {} });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong. Try again."), { status: res.status });
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

function drawTop() {
  $("#who").className = "row";
  $("#who").innerHTML = me?.user
    ? `<a class="purse" id="purse" href="#/money" title="Your balance and history">${PURSE}${money(me.balance)}</a><button class="linkish" id="out">Sign out</button>`
    : me === null ? `<a class="btn small" href="/auth/google">Sign in with Google</a>` : "";
  $("#out")?.addEventListener("click", async () => { await post("/auth/logout", {}); me = null; location.hash = "#/"; drawTop(); route(); });
}
async function refreshMe() {
  try { const r = await api("/api/me"); me = r.user ? r : null; } catch { me = null; }
  drawTop();
}
function dropCoins() {
  const p = $("#purse"); if (!p || CALM) return;
  for (let i = 0; i < 5; i++) setTimeout(() => { const c = document.createElement("i"); c.className = "coin"; p.append(c); c.onanimationend = () => c.remove(); }, i * 130);
}
// Morph between views where the browser can.
function swap(fn) { document.startViewTransition && !CALM ? document.startViewTransition(fn) : fn(); }

function bookCard(s, href, cls = "") {
  const inner = `<span class="spine" style="--bk:${COLORS[s.key]}"></span><span class="pages"></span>
    <span class="front">${s.cover ? `<img src="/art/${s.cover}?thumb=1" alt="" width="320" height="480" style="view-transition-name:cover-${s.key}">` : `<span class="painting">Being painted</span>`}<span class="title">${esc(s.title)}</span></span>`;
  return `<a class="book3d ${cls}" href="${href}" aria-label="${esc(s.title)}">${inner}</a>`;
}

function viewHome() {
  const stories = catalog?.stories || [];
  const signedIn = !!me?.user;
  app.innerHTML = `
    <div class="hero">
      ${signedIn ? `<h2>Which story are you in next?</h2>` : `<h1>A picture book with you in it.</h1>
      <p>Pick a book and add a photo. In under a minute, you're on all 20 pages. Each book costs $0.99.</p>
      ${me === null ? `<div class="row"><a class="btn big" href="/auth/google">Sign in with Google to start</a>${catalog?.devLogin ? `<a class="btn ghost" href="/auth/dev">Dev sign-in</a>` : ""}</div>` : ""}`}
    </div>
    <div class="shelf-row">${stories.map((s) => bookCard(s, signedIn ? `#/new/${s.key}` : "/auth/google")).join("") || `<div style="aspect-ratio:2/3;width:200px"></div>`}</div>
    ${signedIn ? `<section><h2>Your books</h2><div id="books" class="shelf"><p class="note">Opening your shelf</p></div></section>` : ""}`;
  if (signedIn) drawShelf();
}

async function drawShelf() {
  const box = $("#books");
  try {
    const { books } = await api("/api/books");
    if (!$("#books")) return;
    box.innerHTML = books.length ? books.map((b) => {
      const url = b.pages[0]?.url;
      const s = { key: b.story, title: b.title, cover: null };
      return `<div class="item"><a class="book3d tiny" href="#/book/${b.id}" aria-label="Open ${esc(b.title)}, starring ${esc(b.child.name)}"><span class="spine" style="--bk:${COLORS[b.story]}"></span><span class="pages"></span><span class="front">${url ? `<img src="${url}?thumb=1" alt="" loading="lazy">` : `<span class="painting">${b.status === "failed" ? "This one couldn't be made" : "Being painted"}</span>`}<span class="title">${esc(s.title)}</span></span></a>
        <small>Starring ${esc(b.child.name)}<br>${when(b.createdAt)}${b.status === "done" ? `<br><a href="/api/books/${b.id}/pdf">Download PDF</a>` : ""}</small></div>`;
    }).join("") : `<p class="note">Your finished books live here, ready to read or download again. Pick a story above to make your first.</p>`;
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function viewNew(key) {
  if (!me?.user) return viewHome();
  const s = catalog?.stories.find((x) => x.key === key);
  if (!s) { location.hash = "#/"; return; }
  document.documentElement.style.setProperty("--story", COLORS[key]);
  const enough = me.balance >= me.bookCents;
  app.innerHTML = `
    <form class="open" id="f" enctype="multipart/form-data">
      <div class="leftp">
        <label class="oval" id="drop" for="photo" style="margin:14px">
          <span id="ovaltext">Who's the star? <br><span style="font:400 15px Andika,sans-serif">Add a photo</span></span>
          <img id="ph" alt="" hidden>
          <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
        </label>
        <p class="note" style="max-width:26ch">One person, facing the camera, with their face well lit.</p>
        <p id="lastrow"></p>
      </div>
      <div class="rightp">
        <div class="titleline">${esc(s.title)},<br>starring <em id="starname">you</em></div>
        <label for="name">Their name</label>
        <input id="name" name="name" type="text" maxlength="40" required autocomplete="off">
        <input type="hidden" id="same" name="samePhoto" value="">
        <label>The story calls them</label>
        <div class="seg" role="radiogroup">
          ${["he", "she", "they"].map((p) => `<label><input type="radio" name="pronoun" value="${p}" ${p === s.pronoun ? "checked" : ""}>${p}</label>`).join("")}
        </div>
        <details><summary>Add to the About Me page <span class="note" style="font-weight:400">(optional)</span></summary>
          <label for="age">Age</label><input id="age" name="age" type="text" maxlength="20">
          <label for="likes">Favourite thing to do</label><input id="likes" name="likes" type="text" maxlength="60">
          <label for="food">Favourite food</label><input id="food" name="food" type="text" maxlength="60">
          <label for="growUp">When I grow up</label><input id="growUp" name="growUp" type="text" maxlength="60">
          <label for="more">Anything else</label><textarea id="more" name="more" maxlength="300"></textarea>
        </details>
        <div class="go">
          <div id="ferr"></div>
          ${s.ready ? (enough
            ? `<button class="btn big" id="go">Make my book for $0.99</button><p class="note" style="margin-top:8px">Your balance is ${money(me.balance)}.</p>`
            : `<p style="margin-bottom:10px">A book costs $0.99, and your balance is ${money(me.balance)}.</p><a class="btn big" href="#/money">Add money</a>`)
            : `<p class="note">This story's pictures are still being painted. Come back in a few minutes.</p>`}
        </div>
      </div>
      ${s.cover && !CALM ? `<div class="swing" aria-hidden="true"><img src="/art/${s.cover}?thumb=1" alt=""><div></div></div>` : ""}
    </form>`;
  const setPhoto = (src) => { const ph = $("#ph"); ph.src = src; ph.hidden = false; $("#ovaltext").hidden = true; };
  $("#photo").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) { setPhoto(URL.createObjectURL(f)); $("#same").value = ""; $("#lastrow").textContent = ""; }
  });
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (!f) return; const dt = new DataTransfer(); dt.items.add(f); $("#photo").files = dt.files; $("#photo").dispatchEvent(new Event("change")); });
  $("#name").addEventListener("input", (e) => { $("#starname").textContent = e.target.value.trim() || "you"; });
  api("/api/books").then(({ books }) => {
    const last = books.find((b) => b.photo);
    if (!last || !$("#f") || $("#photo").files[0]) return;
    $("#lastrow").innerHTML = `<button type="button" class="linkish" id="uselast">Use my last photo</button>`;
    $("#uselast").onclick = () => { setPhoto(`/img/${last.photo}?thumb=1`); $("#same").value = "1"; $("#photo").required = false; $("#lastrow").textContent = "Using your last photo."; };
  }).catch(() => {});
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const go = $("#go"); if (!go) return;
    go.disabled = true; go.textContent = "Opening your book";
    const fd = new FormData(e.target); fd.append("story", key);
    try {
      const { id } = await api("/api/books", { method: "POST", body: fd });
      me.balance -= me.bookCents; drawTop();
      location.hash = `#/book/${id}`;
    } catch (err) {
      $("#ferr").innerHTML = `<div class="err">${esc(err.message)}</div>`;
      go.disabled = false; go.textContent = "Make my book for $0.99";
    }
  });
}

function viewBook(id) {
  if (!me?.user) return viewHome();
  app.innerHTML = `<p class="note">Opening your book</p>`;
  api(`/api/books/${id}`).then(({ book }) => {
    document.documentElement.style.setProperty("--story", COLORS[book.story]);
    if (book.status === "running") return viewMaking(book);
    if (book.status === "failed") return (app.innerHTML = `<div class="paper"><h2>This book couldn't be made</h2><div class="err">${esc(book.error)}</div><p>The $0.99 went back to your balance. <a href="#/new/${book.story}">Try again</a></p></div>`);
    viewReader(book);
  }).catch((e) => (app.innerHTML = `<div class="err">${esc(e.message)}</div>`));
}

// The progress climbs: a beanstalk for Jack, a forest path for Little Red.
function climbSvg(story) {
  const isJack = story === "jack";
  const d = isJack ? "M60 600 C10 520 110 470 60 390 C10 310 110 260 60 180 C30 120 80 70 60 22" : "M60 600 C120 540 0 500 60 430 C120 360 0 320 60 250 C120 180 10 130 60 58";
  const colour = isJack ? "#49b777" : "#d9c28e";
  const goal = isJack
    ? `<path d="M34 34V10l7 6 6-10 7 10 6-10 7 10 6-6v24z" fill="#c9d3ec"/><rect x="52" y="20" width="16" height="14" rx="8" fill="#2b3468"/>`
    : `<path d="M34 58V36l26-20 26 20v22z" fill="#c9a06a"/><path d="M28 38L60 12l32 26z" fill="#8c5a3a"/><rect x="53" y="42" width="14" height="16" fill="#2b3468"/>`;
  return `<svg class="vine" viewBox="0 0 120 620" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${isJack ? "A beanstalk" : "A forest path"} growing as your book is painted">
    ${goal}
    <path d="${d}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="${isJack ? 9 : 13}" stroke-linecap="round"/>
    <path id="climb" d="${d}" pathLength="100" fill="none" stroke="${colour}" stroke-width="${isJack ? 9 : 13}" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="98" style="transition:stroke-dashoffset .6s ease-out"/>
    <g id="climber">${isJack ? `<ellipse rx="15" ry="8" fill="#49b777" transform="rotate(-24)"/>` : `<path d="M0-14 12 10H-12z" fill="#d0303b"/><circle cy="-13" r="6" fill="#f0c9a5"/>`}</g>
  </svg>`;
}

function viewMaking(book) {
  const words = (catalog?.stories.find((s) => s.key === book.story) || {});
  app.innerHTML = `<div class="making">
    <div>${climbSvg(book.story)}</div>
    <div class="status">
      <h2 id="stage" aria-live="polite">Reading your photo</h2>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barw"><i id="bar" style="width:2%"></i></div>
      <div class="row note" style="justify-content:space-between"><span id="clock">0 seconds</span><span>${esc(book.title)}, starring ${esc(book.child.name)}</span></div>
      <div class="easel">
        <div class="fresh" id="fresh">The first page is on the easel.</div>
        <div class="slots">${Array.from({ length: 20 }, (_, i) => `<div class="slot" id="s${i + 1}">${i + 1}</div>`).join("")}</div>
      </div>
    </div>
  </div>`;
  const path = $("#climb"), climber = $("#climber"), L = path.getTotalLength();
  const climbTo = (pct) => {
    path.style.strokeDashoffset = 100 - pct;
    const pt = path.getPointAtLength((pct / 100) * L);
    climber.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
  };
  climbTo(2);
  const started = Date.now();
  const tick = setInterval(() => { const el = $("#clock"); if (!el) return clearInterval(tick); const s = Math.round((Date.now() - started) / 1000); el.textContent = `${s} second${s === 1 ? "" : "s"}`; }, 500);
  stream?.close();
  stream = new EventSource(`/api/books/${book.id}/events`);
  const seen = new Set();
  stream.onmessage = (ev) => {
    const s = JSON.parse(ev.data);
    const stage = $("#stage"); if (!stage) return stream.close();
    if (s.label) stage.textContent = s.label;
    $("#bar").style.width = `${s.percent}%`; $("#barw").setAttribute("aria-valuenow", Math.round(s.percent));
    climbTo(s.percent);
    for (const t of s.thumbs || []) {
      if (seen.has(t.n)) continue; seen.add(t.n);
      $(`#s${t.n}`).innerHTML = `<img src="${t.url}" alt="Page ${t.n}">`;
      $("#fresh").innerHTML = `<img src="${t.url}" alt="Page ${t.n}, just painted">`;
    }
    if (s.stage === "done" || s.stage === "failed" || s.stage === "lost") { stream.close(); clearInterval(tick); setTimeout(() => viewBook(book.id), s.stage === "done" ? 900 : 0); }
  };
  stream.onerror = () => { stream.close(); clearInterval(tick); setTimeout(() => { if ($("#stage")) viewBook(book.id); }, 2000); };
}

function pageHtml(book, i) {
  const n = book.pages.length;
  if (i === n + 1) return `<div class="back"><h3>The End</h3><a class="btn" style="background:#fff;color:var(--ink)" href="/api/books/${book.id}/pdf">Download PDF</a><a style="color:#fff" href="#/">Back to your shelf</a></div>`;
  if (i === n) {
    const c = book.child;
    const rows = [["age", "Age"], ["likes", "Favourite thing to do"], ["food", "Favourite food"], ["growUp", "When I grow up"]].filter(([k]) => c[k]);
    return `<div class="about"><h3>About Me</h3>${book.portrait ? `<img src="/img/${book.portrait}" alt="">` : ""}<b>${esc(c.name)}</b><span>starring as ${book.story === "red" ? "Little Red" : "Jack"}</span>
      <dl>${rows.map(([k, l]) => `<dt>${l}</dt><dd>${esc(c[k])}</dd>`).join("")}</dl>${c.more ? `<p>${esc(c.more)}</p>` : ""}</div>`;
  }
  const p = book.pages[i], pl = p.place, b = pl.box;
  const art = pl.mode === "framed" ? `<img src="${p.url}" alt="" style="left:${pl.art.left * 100}%;top:${pl.art.top * 100}%;width:${(pl.art.right - pl.art.left) * 100}%;height:${(pl.art.bottom - pl.art.top) * 100}%">` : `<img src="${p.url}" alt="">`;
  const size = (v) => `${(v / 432) * 100}cqw`;
  const lines = pl.lines.map((l) => `<span style="line-height:${size(pl.lineH)}">${esc(l.text)}</span>`).join("");
  const sub = pl.sub ? `<small style="font-size:${size(pl.sub.size)};line-height:${size(pl.sub.lineH)}">${esc(pl.sub.text)}</small>` : "";
  return `${art}<div class="words ${pl.font === "title" ? "title" : ""}" style="left:${b.left * 100}%;top:${b.top * 100}%;width:${(b.right - b.left) * 100}%;height:${(b.bottom - b.top) * 100}%;font-size:${size(pl.size)};${pl.mode === "framed" ? "background:none" : ""}">${lines}${sub}</div>`;
}

function viewReader(book) {
  let i = 0, busy = false;
  const count = book.pages.length + 2; // the pages, About Me, the back cover
  const t = book.timing || {};
  const retried = book.pages.filter((p) => (p.attempts || []).filter((a) => !a.skipped).length > 1);
  app.innerHTML = `<div class="row" style="justify-content:space-between"><h2>${esc(book.title)}, starring ${esc(book.child.name)}</h2><a class="btn" href="/api/books/${book.id}/pdf">Download PDF</a></div>
    <div class="reader">
      <div><div class="stack" id="stack" tabindex="0" aria-label="The book. Use the arrow keys to turn pages."></div>
        <div class="nav"><button class="btn ghost small" id="prev">Back</button><span id="pos" class="note" style="min-width:96px;text-align:center"></span><button class="btn ghost small" id="next">Next</button></div></div>
      <div>
        <p class="note">Drag a page, swipe, or use the arrow keys to turn it. This book stays on your shelf.</p>
        <div class="strip">${book.pages.map((p, n) => `<button data-i="${n}" aria-label="Page ${p.n}"><img src="${p.url}?thumb=1" alt="" loading="lazy"></button>`).join("")}<button data-i="${book.pages.length}" aria-label="About Me" style="background:var(--paper);color:var(--ink);font-size:11px;line-height:1.1">About Me</button></div>
        <details style="margin-top:20px"><summary>How this book was checked</summary>
          <p class="scores">Made in ${t.totalMs ? (t.totalMs / 1000).toFixed(0) : "?"} seconds. Every picture was analysed. ${retried.length ? `${retried.length} ${retried.length === 1 ? "page was" : "pages were"} repainted: ${retried.map((p) => `page ${p.n}`).join(", ")}.` : "Every page passed the first time."}${t.outOfTime ? ` ${t.outOfTime} kept the best try when time ran out.` : ""}</p>
        </details>
      </div>
    </div>`;
  const stack = $("#stack");
  const leaf = (n, cls = "") => `<div class="leaf ${cls}">${pageHtml(book, n)}</div>`;
  const label = (n) => (n === book.pages.length ? "About Me" : n > book.pages.length ? "The End" : `Page ${n + 1} of 20`);
  const settle = () => {
    stack.innerHTML = leaf(i);
    $("#pos").textContent = label(i);
    $("#prev").disabled = i === 0; $("#next").disabled = i === count - 1;
    app.querySelectorAll(".strip button").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === i)));
    busy = false;
  };
  // Turning: the upper leaf swings around the spine and shows the leaf beneath.
  const finish = (top, angle, then) => {
    let done = false;
    const end = () => { if (done) return; done = true; then(); };
    top.classList.add("anim");
    top.addEventListener("transitionend", end, { once: true });
    setTimeout(end, 750);
    requestAnimationFrame(() => { top.style.transform = `rotateY(${angle}deg)`; });
  };
  const turnTo = (target) => {
    if (busy || target === i || target < 0 || target >= count) return;
    if (CALM) { i = target; return settle(); }
    busy = true;
    if (target > i) {
      stack.innerHTML = leaf(target) + leaf(i, "top");
      finish($(".top", stack), -178, () => { i = target; settle(); });
    } else {
      stack.innerHTML = leaf(i) + leaf(target, "top");
      const top = $(".top", stack);
      top.style.transform = "rotateY(-178deg)";
      top.getBoundingClientRect();
      finish(top, 0, () => { i = target; settle(); });
    }
  };
  $("#prev").onclick = () => turnTo(i - 1);
  $("#next").onclick = () => turnTo(i + 1);
  app.querySelectorAll(".strip button").forEach((b) => (b.onclick = () => turnTo(+b.dataset.i)));

  // Dragging: the page follows the pointer, then finishes or falls back.
  let drag = null;
  stack.addEventListener("pointerdown", (e) => {
    if (busy || e.target.closest("a,button")) return;
    drag = { x: e.clientX, w: stack.clientWidth, dir: 0, top: null, moved: false };
  });
  addEventListener("pointermove", (e) => {
    if (!drag || !$("#stack")) return;
    const dx = e.clientX - drag.x;
    if (!drag.dir) {
      if (Math.abs(dx) < 8) return;
      drag.dir = dx < 0 ? 1 : -1;
      const target = i + drag.dir;
      if (target < 0 || target >= count) { drag = null; return; }
      drag.target = target;
      stack.innerHTML = drag.dir > 0 ? leaf(target) + leaf(i, "top") : leaf(i) + leaf(target, "top");
      drag.top = $(".top", stack);
    }
    const p = Math.min(1, Math.abs(dx) / drag.w);
    drag.p = drag.dir > 0 ? p : 1 - p;
    drag.top.style.transform = `rotateY(${-178 * drag.p}deg)`;
  });
  addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.top || !$("#stack")) return;
    busy = true;
    const commit = (d.dir > 0 ? d.p : 1 - d.p) > 0.3; // dragged far enough to turn
    finish(d.top, (d.dir > 0) === commit ? -178 : 0, () => { if (commit) i = d.target; settle(); });
  });
  settle();
  // Load the full pages ahead, so turning has no delay.
  book.pages.forEach((p) => { new Image().src = p.url; });
}

async function viewMoney(flash) {

    const w = await api("/api/wallet");
    me.balance = w.balance; drawTop();
    const kindLabel = { deposit: "Added", book: "Book", book_refund: "Book not charged", refund: "Refund", refund_reversed: "Refund reversed" };

      <div class="money">

          <div class="bignum">${money(w.balance)}</div>
          <p class="note">${w.balance >= w.bookCents ? `Enough for ${Math.floor(w.balance / w.bookCents)} ${Math.floor(w.balance / w.bookCents) === 1 ? "book" : "books"}, at $0.99 each.` : "A book costs $0.99."}</p>

            return `<div style="border-bottom:1px solid var(--line);padding:9px 0"><div class="row" style="justify-content:space-between"><span>${money(p.cents)} on ${when(p.paid_at)}</span>
              ${left >= 50 ? `<button class="linkish" data-open="${p.id}">Request a refund</button>` : `<span class="note">${p.refunded ? `${money(p.refunded)} refunded` : "Already spent"}</span>`}</div>
              <form class="refund" data-refund="${p.id}" hidden>

        </div>

          <h3>Transaction history</h3>

            ${w.ledger.map((l) => `<tr><td style="white-space:nowrap">${when(l.at)}</td><td><b>${kindLabel[l.kind] || esc(l.kind)}</b><br><span class="note">${l.bookId ? `<a href="#/book/${l.bookId}">${esc(l.cause)}</a>` : esc(l.cause)}</span></td><td class="num ${l.cents > 0 ? "plus" : ""}">${l.cents > 0 ? "+" : "-"}${money(l.cents)}</td><td class="num">${money(l.balanceAfter)}</td></tr>`).join("")}

}

function route() {
  stream?.close();
  document.documentElement.style.removeProperty("--story");
  const [, a, b] = location.hash.split("/");
  window.scrollTo(0, 0);
  if (a === "new") return viewNew(b);
  if (a === "book") return viewBook(+b);
  if (a === "money") return viewMoney();
  viewHome();
}
addEventListener("hashchange", () => swap(route));
addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowRight") $("#next")?.click();
  if (e.key === "ArrowLeft") $("#prev")?.click();
});

// The page draws at once; the catalog and sign-in state fill in behind it.
viewHome();
fetch("/catalog.json").then((r) => r.json()).then((c) => { catalog = c; route(); });
refreshMe().then(async () => {
  const params = new URLSearchParams(location.search);
  const funded = params.get("funded");
  if (funded && me?.user) {
    history.replaceState(null, "", "/#/money");
    try { await post("/api/wallet/confirm", { sessionId: funded }); await refreshMe(); await viewMoney(`<div class="ok">Money added. Your balance is ${money(me.balance)}.</div>`); dropCoins(); return; } catch {}
  }
  if (params.get("signin")) history.replaceState(null, "", "/" + location.hash);
  route();
});
